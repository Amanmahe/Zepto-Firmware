name: Build Zephyr apps for BeagleConnect Zepto

# Trigger: on every push/PR, and manually via the Actions tab ("Run workflow")
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ZEPHYR_SDK_VERSION: "1.0.1"
  BOARD: "beagleconnect_zepto/mspm0l1117"
  # Pinned to a known-good commit on zephyrproject/zephyr's main branch
  # (2026-08-26). Tracking "main" directly is NOT reproducible: it moves
  # every day, and an upstream regression (e.g. clock/GPIO driver changes)
  # can silently break boards between one CI run and the next even though
  # nothing in this repo changed. Bump this only after confirming a newer
  # commit still boots correctly on real hardware.
  ZEPHYR_PIN_REVISION: "837578d95303a7582d11f5673d29d76c48336e3a"

permissions:
  contents: write   # needed so the workflow can create tags/releases

jobs:
  # ------------------------------------------------------------------
  # Treats any folder in the repo that directly contains a CMakeLists.txt
  # as a Zephyr app — works whether apps live flat at the repo root
  # (default/, gpio_toggle/) or nested one level deeper (apps/blinky/).
  # Non-app folders like .github/ or tools/ are skipped automatically
  # since they don't have a CMakeLists.txt. Add a new app anywhere in
  # the repo with a CMakeLists.txt + source — you never need to touch
  # this workflow file.
  # ------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Build app list (any folder containing a CMakeLists.txt)
        id: set-matrix
        run: |
          echo "Top-level folders in repo:"
          find . -mindepth 1 -maxdepth 1 -type d -printf '  %f\n'

          # Matches a CMakeLists.txt at any depth >= 2, so it finds both
          # a flat top-level app (default/CMakeLists.txt) and a nested
          # one (apps/blinky/CMakeLists.txt). tools/ is excluded since
          # it's scripts, not an app.
          apps=$(find . -mindepth 2 -name CMakeLists.txt \
                 -not -path "./tools/*" \
                 -printf '%h\n' | sed 's|^\./||' | sort -u)

          if [ -z "$apps" ]; then
            echo "::error::No app folders found — no directory in the repo has a CMakeLists.txt in it. Run 'git ls-files | grep CMakeLists.txt' locally to check what's actually committed and pushed."
            exit 1
          fi

          json=$(printf '%s\n' "$apps" | jq -R . | jq -sc '{app: .}')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered apps:"
          printf '%s\n' "$apps" | sed 's/^/  /'

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # Source for this build lives at $GITHUB_WORKSPACE/${{ matrix.app }}
        # (e.g. default/, or apps/blinky/ if nested one level deeper).
        # Patches (applied to Zephyr itself, if any) live under patches/*.patch

      - name: Compute safe app slug (matrix.app with "/" replaced by "-")
        id: slug
        run: echo "value=$(echo '${{ matrix.app }}' | tr '/ ' '--')" >> "$GITHUB_OUTPUT"

      - name: Compute app name (basename of matrix.app, used for the hex filename)
        id: appname
        run: echo "value=$(basename '${{ matrix.app }}')" >> "$GITHUB_OUTPUT"

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build device-tree-compiler gperf ccache \
            dfu-util file wget xz-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install west
        run: pip install west

      - name: Initialize Zephyr workspace (shallow, pinned commit)
        # "west init --mr <branch>" only accepts branch/tag names, not raw
        # commit SHAs (git clone --branch rejects them), so to pin to an
        # exact commit we shallow-fetch it ourselves and hand the already
        # cloned repo to "west init -l" instead of letting west clone it.
        run: |
          mkdir -p zephyrproject/zephyr
          cd zephyrproject/zephyr
          git init -q
          git remote add origin https://github.com/zephyrproject-rtos/zephyr.git
          git fetch --depth 1 origin "$ZEPHYR_PIN_REVISION"
          git checkout -q FETCH_HEAD
          cd ../..
          west init -l zephyrproject/zephyr
          cd zephyrproject
          # Only pull the modules this board target actually needs
          west update --narrow -o=--depth=1 hal_ti cmsis cmsis_6

      - name: Install Zephyr Python requirements
        run: pip install -r zephyrproject/zephyr/scripts/requirements.txt

      - name: Download Zephyr SDK (minimal bundle + arm-zephyr-eabi toolchain only)
        run: |
          cd ${{ github.workspace }}
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz" -O sdk-minimal.tar.xz
          mkdir -p zephyr-sdk-${ZEPHYR_SDK_VERSION}
          tar xf sdk-minimal.tar.xz -C ${{ github.workspace }}

          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/toolchain_gnu_linux-x86_64_arm-zephyr-eabi.tar.xz" -O arm-toolchain.tar.xz
          mkdir -p zephyr-sdk-${ZEPHYR_SDK_VERSION}/gnu/arm-zephyr-eabi
          tar xf arm-toolchain.tar.xz -C zephyr-sdk-${ZEPHYR_SDK_VERSION}/gnu/arm-zephyr-eabi --strip-components=1

      # patches/ is currently empty (the MSPM0L1117 GPIO pin-table issue
      # that used to live here was fixed upstream in Zephyr `main` as of
      # late July 2026). This step is generic and safe either way: it
      # applies every *.patch file found in patches/, in name order
      # (0001-, 0002-, ...), and does nothing if the folder is empty.
      # Drop a new patch here later without touching this workflow.
      - name: Apply local Zephyr patches (patches/*.patch)
        run: |
          shopt -s nullglob
          patches=("${{ github.workspace }}"/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patches found in patches/, skipping."
          else
            for p in "${patches[@]}"; do
              echo "Applying $p"
              (cd zephyrproject/zephyr && git apply --check "$p" && git apply "$p")
            done
          fi

      - name: Build ${{ matrix.app }}
        env:
          ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          ZEPHYR_TOOLCHAIN_VARIANT: zephyr
        run: |
          cd zephyrproject
          west build -b ${{ env.BOARD }} "${{ github.workspace }}/${{ matrix.app }}" -d build_${{ steps.slug.outputs.value }}

      - name: Rename hex output to a unique, app-identifiable filename
        # Every app's build produces "zephyr.hex" — rename it per-app so
        # all of them can be collected side by side into a single release
        # later without overwriting each other.
        run: |
          mkdir -p release-hex
          cp "zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.hex" \
             "release-hex/${{ steps.appname.outputs.value }}.hex"

      - name: Upload hex artifact (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: hex-${{ steps.slug.outputs.value }}
          path: release-hex/${{ steps.appname.outputs.value }}.hex
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publishes a single GitHub release per workflow run, containing the
  # .hex file for every app built above. Only runs on push / manual
  # runs — not on pull_request builds, since PRs from forks can't
  # push tags/releases.
  # ------------------------------------------------------------------
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all hex artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hex-*
          path: release-hex
          merge-multiple: true

      - name: List collected hex files
        run: ls -la release-hex/

      - name: Compute release tag
        id: tag
        run: echo "name=zepto-examples-v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create tag + release with all firmware hex files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Zepto examples using zephyr"
          body: |
            Automated build of all example apps for `${{ env.BOARD }}`
            (BeagleConnect Zepto).

            Each `.hex` file is a flashable firmware image for one app —
            the filename identifies which app it was built from.

            Built from commit ${{ github.sha }} (run ${{ github.run_number }}).
          files: release-hex/*.hex