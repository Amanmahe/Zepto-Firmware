name: Build Zephyr apps for BeagleConnect Zepto

# Trigger: on every push/PR, and manually via the Actions tab ("Run workflow")
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ZEPHYR_SDK_VERSION: "1.0.1"
  BOARD: "beagleconnect_zepto/mspm0l1117"

permissions:
  contents: write   # needed so the workflow can create tags/releases

jobs:
  # ------------------------------------------------------------------
  # Treats any folder in the repo that directly contains a CMakeLists.txt
  # as a Zephyr app — works whether apps live flat at the repo root
  # (default/, gpio_toggle/) or nested one level deeper (apps/blinky/).
  # Non-app folders like .github/ or tools/ are skipped automatically
  # since they don't have a CMakeLists.txt. Add a new app anywhere in
  # the repo with a CMakeLists.txt + source — you never need to touch
  # this workflow file.
  # ------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Build app list (any folder containing a CMakeLists.txt)
        id: set-matrix
        run: |
          echo "Top-level folders in repo:"
          find . -mindepth 1 -maxdepth 1 -type d -printf '  %f\n'

          # Matches a CMakeLists.txt at any depth >= 2, so it finds both
          # a flat top-level app (default/CMakeLists.txt) and a nested
          # one (apps/blinky/CMakeLists.txt). tools/ is excluded since
          # it's scripts, not an app.
          apps=$(find . -mindepth 2 -name CMakeLists.txt \
                 -not -path "./tools/*" \
                 -printf '%h\n' | sed 's|^\./||' | sort -u)

          if [ -z "$apps" ]; then
            echo "::error::No app folders found — no directory in the repo has a CMakeLists.txt in it. Run 'git ls-files | grep CMakeLists.txt' locally to check what's actually committed and pushed."
            exit 1
          fi

          json=$(printf '%s\n' "$apps" | jq -R . | jq -sc '{app: .}')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered apps:"
          printf '%s\n' "$apps" | sed 's/^/  /'

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # Source for this build lives at $GITHUB_WORKSPACE/${{ matrix.app }}
        # (e.g. default/, or apps/blinky/ if nested one level deeper).
        # Patches (applied to Zephyr itself, if any) live under patches/*.patch

      - name: Compute safe app slug (matrix.app with "/" replaced by "-")
        id: slug
        run: echo "value=$(echo '${{ matrix.app }}' | tr '/ ' '--')" >> "$GITHUB_OUTPUT"

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build device-tree-compiler gperf ccache \
            dfu-util file wget xz-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install west
        run: pip install west

      - name: Initialize Zephyr workspace (shallow)
        run: |
          west init --mr main -o=--depth=1 --mf west.yml zephyrproject
          cd zephyrproject
          # Only pull the modules this board target actually needs
          west update --narrow -o=--depth=1 hal_ti cmsis cmsis_6

      - name: Install Zephyr Python requirements
        run: pip install -r zephyrproject/zephyr/scripts/requirements.txt

      - name: Download Zephyr SDK (minimal bundle + arm-zephyr-eabi toolchain only)
        run: |
          cd ${{ github.workspace }}
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz" -O sdk-minimal.tar.xz
          mkdir -p zephyr-sdk-${ZEPHYR_SDK_VERSION}
          tar xf sdk-minimal.tar.xz -C ${{ github.workspace }}

          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/toolchain_gnu_linux-x86_64_arm-zephyr-eabi.tar.xz" -O arm-toolchain.tar.xz
          mkdir -p zephyr-sdk-${ZEPHYR_SDK_VERSION}/gnu/arm-zephyr-eabi
          tar xf arm-toolchain.tar.xz -C zephyr-sdk-${ZEPHYR_SDK_VERSION}/gnu/arm-zephyr-eabi --strip-components=1

      # patches/ is currently empty (the MSPM0L1117 GPIO pin-table issue
      # that used to live here was fixed upstream in Zephyr `main` as of
      # late July 2026). This step is generic and safe either way: it
      # applies every *.patch file found in patches/, in name order
      # (0001-, 0002-, ...), and does nothing if the folder is empty.
      # Drop a new patch here later without touching this workflow.
      - name: Apply local Zephyr patches (patches/*.patch)
        run: |
          shopt -s nullglob
          patches=("${{ github.workspace }}"/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patches found in patches/, skipping."
          else
            for p in "${patches[@]}"; do
              echo "Applying $p"
              (cd zephyrproject/zephyr && git apply --check "$p" && git apply "$p")
            done
          fi

      - name: Build ${{ matrix.app }}
        env:
          ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          ZEPHYR_TOOLCHAIN_VARIANT: zephyr
        run: |
          cd zephyrproject
          west build -b ${{ env.BOARD }} "${{ github.workspace }}/${{ matrix.app }}" -d build_${{ steps.slug.outputs.value }}

      - name: Generate plain-text hex dump
        run: |
          python3 - <<EOF
          with open('zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.bin', 'rb') as f:
              data = f.read()
          with open('zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.txt', 'w') as out:
              for i in range(0, len(data), 16):
                  chunk = data[i:i+16]
                  hexpart = ' '.join(f'{b:02x}' for b in chunk)
                  ascii_part = ''.join(chr(b) if 32 <= b < 127 else '.' for b in chunk)
                  out.write(f'{i:08x}  {hexpart:<47}  {ascii_part}\n')
          EOF

      - name: Collect readable source for the release
        # Lets someone SEE the code for this app, plus any patches that
        # were applied to Zephyr itself, instead of only getting the
        # compiled .bin/.hex/.elf. Handles both layouts: source in a
        # src/ subfolder, or .c files directly in the app folder.
        run: |
          mkdir -p release-src/app-src
          if [ -d "${{ matrix.app }}/src" ]; then
            cp -r "${{ matrix.app }}/src/." release-src/app-src/
          else
            cp "${{ matrix.app }}"/*.c release-src/app-src/ 2>/dev/null || true
            cp "${{ matrix.app }}"/*.h release-src/app-src/ 2>/dev/null || true
          fi
          cp "${{ matrix.app }}/CMakeLists.txt" release-src/ 2>/dev/null || true
          cp "${{ matrix.app }}/prj.conf" release-src/ 2>/dev/null || true
          mkdir -p release-src/patches
          cp patches/*.patch release-src/patches/ 2>/dev/null || true

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.slug.outputs.value }}-beagleconnect_zepto
          path: |
            zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.bin
            zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.hex
            zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.txt
            zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.elf
            release-src/
          if-no-files-found: error

      # --- Tag + GitHub Release, one per app per run ---
      # Only on push to a branch / manual runs — not on pull_request builds,
      # since PRs from forks can't push tags/releases.
      - name: Compute release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: echo "name=${{ steps.slug.outputs.value }}-zepto-v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create tag + release with firmware and source
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "${{ matrix.app }} @ ${{ env.BOARD }} — build ${{ github.run_number }}"
          body: |
            Automated build of `${{ matrix.app }}` for `${{ env.BOARD }}`
            (BeagleConnect Zepto).

            Includes:
            - `zephyr.bin` / `zephyr.hex` / `zephyr.elf` — flashable firmware
            - `zephyr.txt` — plain-text hex dump of the binary
            - `app-src/` — the actual app source that was built (edit
              `${{ matrix.app }}/` in the repo to change it)
            - `patches/` — any local Zephyr patches applied for this build

            Built from commit ${{ github.sha }}.
          files: |
            zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.bin
            zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.hex
            zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.txt
            zephyrproject/build_${{ steps.slug.outputs.value }}/zephyr/zephyr.elf
            release-src/**