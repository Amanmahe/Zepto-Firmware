CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Let Zephyr's power-management subsystem pick an idle/stop power
# state automatically whenever the CPU has nothing to do, using the
# run/stop/standby states already defined for this SoC family in
# dts/arm/ti/mspm0/l/mspm0l.dtsi.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
