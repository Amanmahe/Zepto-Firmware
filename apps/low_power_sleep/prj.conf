CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# CONFIG_PM=y is intentionally NOT enabled here: on this board/SoC
# (beagleconnect_zepto/mspm0l1117) at the pinned Zephyr revision, it
# hangs the board at boot -- confirmed on real hardware (LED never
# toggles even once, before any sleep has happened). None of the
# mspm0 drivers implement device PM actions either, so CONFIG_PM_DEVICE
# would add risk for zero benefit even if CONFIG_PM itself worked.
# Revisit once upstream Zephyr's mspm0 PM support is fixed.
